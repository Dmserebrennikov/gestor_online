[project]
name = "gestor-online"
version = "0.1.0"
description = "Online Spanish Gestor — Telegram → FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "asyncpg>=0.30.0",
    "langchain>=1.0",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-anthropic>=1.7.0",
    "langchain-google-genai>=4.3.7",
    "langchain-ollama>=1.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.19.1",
    "telegramify-markdown>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Explicit select so this project does not inherit a user-level Ruff config.
# E501 is off in Ruff's defaults; enable it so `ruff check` enforces line-length.
select = ["E4", "E7", "E9", "F", "E501"]
