services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432" # host:container — Windows Postgres can keep 5432
    environment:
      POSTGRES_USER: gestor
      POSTGRES_PASSWORD: gestor
      POSTGRES_DB: gestor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestor -d gestor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
